name: Build Docker Images

on:
  push:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to Dockerfile directory'
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.changes.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: changes
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          BASE_SHA: ${{ github.event.before }}
        run: scripts/detect-changes.sh "$INPUT_PATH" "$BASE_SHA"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      - name: Lint Dockerfiles
        run: make lint

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  build:
    needs: [detect-changes, lint, test-scripts]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.paths != '' && needs.detect-changes.outputs.paths != '[]'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install container-structure-test
        run: |
          curl -fsSL -o container-structure-test https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/

      - name: Log in to Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build images (in dependency order)
        env:
          PATHS: ${{ needs.detect-changes.outputs.paths }}
        run: scripts/ci-build.sh "$PATHS"
